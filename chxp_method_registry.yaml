# chxp_method_registry.yaml — 陳修平 128 條方法總登記冊（正式版）
# ════════════════════════════════════════════════════════════════════
# 來源：龍蝦底稿 prep_20260813/chxp_method_registry.yaml（128 條已驗連號）
#       ＋ cxp-enforce-t2 梯 2 加欄（layer／gate 規則／版本欄）。
# owner（維護責任落人，得標定稿【霸告】嫁接件）：霸告。
#   改一條正典＝改本檔＋bump registry_version；validator 端的期望版本常數
#   （_CHXP_REGISTRY_VERSION_CURRENT）由施工者同步，兩者差一版＝WARN（grace
#   window），差兩版以上＝FAIL。**單點故障防線**：不得因改一條就整批 FAIL。
#
# 🔴 紅線（澤君 TG19810）：本檔的 gate 規則只描述「選了哪個型／哪些欄位要在／
#    證據指標要能解回稿內位置」。**不得**寫入任何語意品質判準（好不好、夠不夠
#    有趣、像不像人話）。validator 端是泛用執行器，改規則改這裡、不改程式。
#
# 分層（澤君 2026-08-13 於「17 條沒做勾選單」全勾）：
#   layer: gate          → 進 validator 的硬閘（兩段式：選了該型才驗結構）
#   layer: blocked_entry → 立條目＋BLOCKED 註記，**不塞 validator**（#058 獨立入口）
#   layer: receipt       → 只要求 chxp_receipt 留紀錄＋證據指標
#   layer: manual        → 人工 checklist（系統零自動對外；見 chxp_manual_checklist_template.md）
#   layer: none          → 本梯未定義機器規則（在冊即可，不得消失）
# ════════════════════════════════════════════════════════════════════
registry_version: chxp-128-v1
previous_version: chxp-128-v1-draft
version_policy: validator 期望版本不符時：差一版＝WARN（grace window，仍照驗內容）；差兩版以上或版本欄缺／格式非法＝FAIL。改一條正典不得讓整批 FAIL。
registry_owner: 霸告
registry_owner_note: 維護責任：條目增修、版本 bump、與 validator 期望版本同步，皆由霸告負責；施工者（愛馬仕等手腳）不得自行改條目語意。
