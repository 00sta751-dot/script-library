script_id: achi_01_01
owner: 阿奇
title: 胖奇不是因為老闆很胖
派系: 故事戲劇派（派11）
main_platform: FB Reels
suggested_po_time: 週三晚 8PM（FB UTIS 興趣對齊高峰）
scenes:
- timestamp: 0-3s
  type: Hook
  台詞_阿奇: 胖奇，你以為是因為老闆很胖？
  藏鏡人: 「哇這名字背後有這樣的故事」
  畫面: 阿奇在店面對鏡頭，指著胖奇招牌，自嘲表情
  翠文: 胖奇這個名字，你以為是因為老闆很胖對吧？根本不是那回事
- timestamp: 3-12s
  type: 破題
  台詞_阿奇: Punch，不是肥胖的胖，是音譯過來的。英文 punch，出拳、反擊的意思。
  畫面: 特寫招牌「胖奇熱狗堡 Punch Hotdog」字樣
  翠文: Punch，英文是出拳反擊的意思，音譯過來就叫胖奇
- timestamp: 12-25s
  type: 核心論述
  台詞_阿奇: 我跟胖胖 2016 年開店，一路走來不是沒有跌倒過。租金、成本、疫情、遷店。但每次跌倒，你只有兩個選擇——摸摸鼻子算了，還是 punch 回去。
  畫面: 店面老照片 B-roll 或阿奇手勢說話
  翠文: 跌倒過不止一次 但每次都只有一個選擇 punch 回去
- timestamp: 25-40s
  type: 案例轉折
  台詞_阿奇: 我們選了後者。現在胖奇在鹽埕第一公有市場，整修中，準備再 punch 一次。
  藏鏡人: 「被打倒了還能站起來，這才是真正的老闆」
  畫面: 整修中的店面空間，阿奇站在其中
  翠文: 我們選了後者，鹽埕整修中，準備再 punch 一次
- timestamp: 40-52s
  type: 收束金句
  台詞_阿奇: 所以這個名字不是在說老闆有多胖，是在說——不管生活打你幾拳，都有辦法重生。
  畫面: 阿奇正視鏡頭，語氣篤定
  翠文: 這個名字說的是——不管生活打你幾拳，都一定有辦法重生
- timestamp: 52-60s
  type: CTA
  台詞_阿奇: 你也有過被打倒又站起來的時候嗎？留言告訴我。
  畫面: 胖奇招牌特寫收尾
  翠文: 你有沒有過被打倒，然後又選擇站起來的時候？留言告訴我
caption: Punch——反擊、重生的意思。開店 9.5 年被打倒過不止一次，但每次我都選 punch 回去。你有沒有被打倒又站起來的時刻？
