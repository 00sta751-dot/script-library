script_id: achi_01_02
owner: 阿奇
title: 我有40cm，每天嚇到人
派系: 自嘲反差派（派12）
main_platform: TikTok
suggested_po_time: 週五下午 5PM（TikTok 下班前滑機高峰）
scenes:
- timestamp: 0-3s
  type: Hook
  台詞_阿奇: 我在鹽埕賣東西，每天都有人被這五個字嚇到。
  藏鏡人: 「哈哈哈這標語太狠了」
  畫面: 阿奇指著招牌「我有40cm」，正經表情
  翠文: 我在鹽埕賣東西，每天都有人被店裡招牌上這五個字嚇到
- timestamp: 3-12s
  type: 破題
  台詞_阿奇: 就是這個——40公分超長熱狗堡，90元。不便宜，也不貴。但每個第一次看到招牌的人，反應都一樣。
  畫面: 招牌特寫 + 幾秒路過客人反應 B-roll
  翠文: 40公分超長熱狗堡 90元 每個第一次看到的人反應都一樣
- timestamp: 12-25s
  type: 核心論述
  台詞_阿奇: 最大特點不是長，是醬料。豬肉加蔬菜自己調，不用罐裝。開店 9.5 年，這個配方一直在改，一直在調。
  畫面: 廚房備料畫面或醬料特寫（不洩底）
  翠文: 最大特點不是夠長，是醬料全程自製，9.5年一直在調
- timestamp: 25-40s
  type: 案例轉折
  台詞_阿奇: 有人說，老闆你這個名字是在釣魚吧。我說，哪有，就是 40 公分。要吃再來確認。
  藏鏡人: 「40公分熱狗真的嗎我要去」
  畫面: 實際熱狗成品特寫，比例感很明確
  翠文: 有人說在釣魚？哪有，就是真的40公分，要吃再來確認
- timestamp: 40-52s
  type: 收束金句
  台詞_阿奇: 鹽埕第一公有市場，整修中，很快回來。你來過嗎？
  畫面: 阿奇帶胖奇圍裙，在店門口
  翠文: 鹽埕第一公有市場，店現在整修中，但很快就會回來了，等我
- timestamp: 52-60s
  type: CTA
  台詞_阿奇: 想知道餐車今天在哪，看 IG 限動 @punch_hotdog，或留言「餐車」我私訊你。
  畫面: IG 帳號字卡
  翠文: 想知道餐車今天跑去哪，留言「餐車」，我直接私訊你地址
caption: 鹽埕每天都有人被「我有40cm」嚇一跳。9.5年老店，醬料自製不用罐裝，90元一個。整修中，很快回來。你問過今天餐車在哪嗎？
