_markdown_body: |-
  # 高雄開車十分鐘，可以跨兩個世界

  **類型**：70% 生活/在地觀察
  **派系**：人間觀察派（主推）/ 嗆辣派（替代）
  **主推平台**：IG Reels / FB Reels
  **建議 PO 時間**：平日 19:10–20:30

  ## 視覺場景
  車裡駕駛座，停好車，手持手機，T-shirt 休閒，自然光，像剛開車繞完一段路。

  ## 6 段時間軸

  **0-3 秒 Hook**
  台詞：「你知道嗎？高雄開車十分鐘，可以跨兩個世界。」
  字幕卡：「高雄開車十分鐘跨兩個世界」

  **3-12 秒 破題**
  台詞：「我跟你說，這件事沒有你想的那麼複雜。左營鬧區，車水馬龍，早午餐排隊。開十分鐘到鼓山，安靜，有老樹，早餐店老闆認識你名字。【藏鏡人 1 共鳴型：「就是說啊，高雄就是這種感覺」】你要哪種生活，你自己最清楚。」
  # 改寫對齊 §10.4 改寫示例 B - 御史 P1 修補（「住哪個不只是地段是你要哪種生活」→ 去文藝感 → 短句直球）

  **12-25 秒 核心**
  台詞：「我帶過很多外縣市的客戶來高雄找房。他們都說預算夠、條件開好了，但選不了。後來我發現，他們不是不知道要什麼，是不知道高雄可以給什麼。你不看，你不知道。」

  **25-40 秒 案例**
  台詞：「有個台北客戶，給我一個清單：捷運站牌、商圈、新大樓。我帶他繞了兩天。第二天他說：那個有老樹的社區，旁邊那家麵，我每天可以去。【藏鏡人 2 驚嘆型：「靠，選到最後選的是麵攤？」】他買了鼓山。」

  **40-52 秒 收束**
  台詞：「買房選的不只是坪數。是你想過哪種日子。」

  **52-60 秒 CTA**
  台詞：「不確定要哪區的，留言「諮詢」，我帶你繞繞，問問不用錢。」
  字幕卡：「留言『諮詢』不用怕問問不用錢」

  藏鏡人：1 共鳴型（3-12 秒）「就是說啊，高雄就是這種感覺」/ 2 驚嘆型（25-40 秒）「靠，選到最後選的是麵攤？」

  ## Caption
  高雄左營跟鼓山開車十分鐘，一個鬧一個靜。台北客戶選好條件繞了兩天，最後選了旁邊有老麵攤的那個社區。買房選的不只是地段。

  ## 流量密碼
  1 真實感 / 3 共鳴 / 9 代入感 / 11 故事 / 15 地域話題

