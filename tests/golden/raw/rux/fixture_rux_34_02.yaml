_markdown_body: |-
  # 帶看遇過最累的不是挑剔的客戶，是那種夫妻

  **類型**：70% 生活/職場觀察
  **派系**：人間觀察派（主推）/ 嗆辣派（替代）
  **主推平台**：IG Reels / FB Reels
  **建議 PO 時間**：平日 19:20–20:30

  ## 視覺場景
  咖啡廳或辦公桌旁，坐姿，手放桌上，語氣像在跟朋友吐槽，但帶著理解。

  ## 6 段時間軸

  **0-3 秒 Hook**
  台詞：「帶看遇過最累的，不是很挑剔的客戶，是那種夫妻。」
  字幕卡：「帶看最累的不是挑剔客戶，是這種夫妻」

  **3-12 秒 破題**
  台詞：「先生說要，太太說再看看。太太說好，先生說等等。看了三間，沒有一間是兩個人同時點頭的。【藏鏡人 1 共鳴型：「哈，我朋友結婚後買房就這樣」】你知道嗎？這不是難搞，這是兩個人都在讓。」

  **12-25 秒 核心**
  台詞：「做房仲帶這種夫妻，我學到一件事。你不要問「這間你喜歡嗎」。要問「這間住起來你覺得怎麼樣」。喜不喜歡是感覺，住起來怎樣是實際。感覺可以讓，實際沒辦法讓。」

  **25-40 秒 案例**
  台詞：「上個月一對夫妻，看了五間都沒結論。我第六間帶他們看完，問先生：太太住起來方便嗎？他說：廚房她說好。我問太太：先生下班停車方便嗎？她說：那個地下室他說 OK。【藏鏡人 2 驚嘆型：「等等，就這樣成了？」】第六間成了。」

  **40-52 秒 收束**
  台詞：「買房最難的關不是找到好房，是兩個人找到同一個答案。」

  **52-60 秒 CTA**
  台詞：「你家現在哪個關卡？留言「諮詢」，問問不用錢。」
  字幕卡：「留言『諮詢』不用怕問問不用錢」

  藏鏡人：1 共鳴型（3-12 秒）「哈，我朋友結婚後買房就這樣」/ 2 驚嘆型（25-40 秒）「等等，就這樣成了？」

  ## Caption
  帶看最累的不是挑剔的人，是一對在讓彼此的夫妻。先生說要太太說等等，太太說好先生說再看看。後來我學會不問喜不喜歡，改問住起來怎麼樣。

  ## 流量密碼
  2 揭露 / 3 共鳴 / 9 代入感 / 11 故事 / 10 情緒

  ## Hashtag
  `#買房夫妻` `#高雄房仲` `#帶看` `#買房心態` `#夫妻` `#房仲日常` `#人間觀察` `#高雄買房` `#北高雄` `#生活`

